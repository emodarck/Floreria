<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<!-- Banner Superior hola -->
<header class="bg-superlightgreen text-white py-3">
    <div class="container d-flex align-items-center justify-content-between">
        <!-- Logo con link -->
        <div>
            <a href="Principal.html">
                <img src="img/logo png.png" alt="Logo Empresa" style="height: 100px;">
            </a>
        </div>
        <!-- Nombre Empresa -->
        <div class="flex-grow-1 text-center">
            <h1 class="display-2 fw-bold m-0">Floreria Julia Rosa</h1>
        </div>
        <!-- Espacio derecho vacío para equilibrio -->
        <div style="width:50px;"></div>
    </div>
</header>

<!-- menú de navegación -->
<nav class="navbar navbar-expand-sm bg-lightgreen navbar-dark mt-0 w-100">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menucollapse">
            <img src="img/menu2.png" alt="Menu" style="width: 30px; height: 30px;">
        </button>
        <div class="collapse navbar-collapse" id="menucollapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="Registro.html">login/Registro</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="Inventario.html">Ver Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="compra.html">Carrito</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">

<h2 class="titulo">Agregar / Editar Producto</h2>
<form id="form-producto">
    <div class="mb-3">
        <label for="producto" class="form-label">Nombre:</label>
        <input type="text" class="form-control" id="producto" required>
    </div>
    <div class="mb-3">
        <label for="precio" class="form-label">Precio:</label>
        <input type="number" class="form-control" id="precio" required>
    </div>
    <input type="submit" class="btn btn-success" value="Agregar">
</form>

<p id="mensaje"></p>

<h2 class="titulo mt-5">Productos Existentes</h2>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>#</th>
            <th>Imagen</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acción</th>
        </tr>
    </thead>
    <tbody id="tabla-productos"></tbody>
</table>

</div>

<!-- Banner Inferior -->
<footer class="bg-lightgreen-footer text-white text-center py-3 mt-4">
    <p class="m-0">&copy; 2025 Floreria Julia Rosa | Todos los derechos reservados</p>
</footer>

<script src="js/productos.js"></script>
<script>
document.getElementById('form-producto').addEventListener('submit', function(e){
    e.preventDefault();
    const nombre = document.getElementById('producto').value.trim();
    const precio = parseFloat(document.getElementById('precio').value.trim());
    const mensaje = document.getElementById('mensaje');

    if(nombre && precio){
        guardarProducto(nombre, precio);
        renderProductos("tabla-productos", true);
        mensaje.innerText = `Producto guardado: ${nombre} - $${precio}`;
        mensaje.style.color = "green";
        this.reset();
    } else {
        mensaje.innerText = "Complete todos los campos";
        mensaje.style.color = "red";
    }
});

// Renderizar tabla al cargar
renderProductos("tabla-productos", true);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
