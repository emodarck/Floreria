<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .titulo {
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            color: darkblue;
            margin-bottom: 25px;
        }
        .caja {
            margin-bottom: 20px;
        }
        .etiqueta {
            font-family: Arial, Helvetica, sans-serif;
            color: darkblue;
            font-size: 14px;
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <!-- Banner Superior -->
    <header class="bg-superlightgreen text-white py-3">
        <div class="container d-flex align-items-center justify-content-between">
            <!-- Logo con link -->
            <div>
                <a href="Principal.html">
                    <img src="img/logo png.png" alt="Logo Empresa" style="height: 100px;">
                </a>
            </div>
            <!-- Nombre Empresa -->
            <div class="flex-grow-1 text-center">
                <h1 class="display-2 fw-bold m-0">Floreria Julia Rosa</h1>
            </div>
            <!-- Espacio derecho vacío para equilibrio -->
            <div style="width:50px;"></div>
        </div>
    </header>

    <!-- menú de navegación -->
    <nav class="navbar navbar-expand-sm bg-lightgreen navbar-dark mt-0 w-100">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menucollapse">
                <img src="img/menu2.png" alt="Menu" style="width: 30px; height: 30px;">
            </button>
            <div class="collapse navbar-collapse" id="menucollapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="Registro.html">login/Registro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Inventario.html">Ver Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="carrito de compra.html">Carrito</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Formulario Registro -->
        <div class="row justify-content-center" style="margin-top: 50px;">
            <div class="col-md-6">
                <form onsubmit="return registrarUsuario();">
                    <h3 class="titulo">Registro/Login de Usuario</h3>

                    <div class="form-group caja">
                        <label for="nombre" class="form-label etiqueta">Nombre:</label>
                        <input type="text" class="form-control" id="nombre">
                    </div>

                    <div class="form-group caja">
                        <label for="correo" class="form-label etiqueta">Correo:</label>
                        <input type="email" class="form-control" id="correo" placeholder="usuario@correo.com">
                    </div>

                    <div class="form-group caja">
                        <label for="pass" class="form-label etiqueta">Contraseña:</label>
                        <input type="password" id="pass" class="form-control" placeholder="********">
                    </div>

                    <!-- Región -->
                    <div class="form-group caja">
                        <label for="region" class="form-label etiqueta">Región:</label>
                        <select id="region" class="form-control">
                            <option value="">Seleccione región</option>
                        </select>
                    </div>

                    <!-- Comuna -->
                    <div class="form-group caja">
                        <label for="comuna" class="form-label etiqueta">Comuna:</label>
                        <select id="comuna" class="form-control" >
                            <option value="">Seleccione comuna</option>
                        </select>
                    </div>

                    <div id="mensaje-error" class="text-danger mb-2"></div>
                    <input type="submit" class="btn btn-primary w-100" value="Registrarse/logearse">
                </form>
            </div>
        </div>
    </div>

    <!-- Banner Inferior -->
    <footer class="bg-lightgreen-footer text-white text-center py-3 mt-4">
        <p class="m-0">&copy; 2025 Floreria Julia Rosa | Todos los derechos reservados</p>
    </footer>

    <script src="js/regiones.js"></script>
    <script src="js/metodo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Inicializar selects de región y comuna
        cargarRegiones("region", "comuna");
    </script>
</body>
</html>
