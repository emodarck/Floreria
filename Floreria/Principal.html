<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejemplo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Banner Superior -->
    <header class="bg-superlightgreen text-white py-3">
        <div class="container d-flex align-items-center justify-content-between">
            <!-- Logo con link -->
            <div>
                <a href="Principal.html">
                    <img src="img/logo png.png" alt="Logo Empresa" style="height: 100px;">
                </a>
            </div>
            <!-- Nombre Empresa -->
            <div class="flex-grow-1 text-center">
                <h1 class="display-2 fw-bold m-0">Floreria Julia Rosa</h1>
            </div>
            <!-- Espacio derecho vacío para equilibrio -->
            <div style="width:50px;"></div>
        </div>
    </header>

    <!-- menú de navegación (pegado al header y ancho completo) -->
    <nav class="navbar navbar-expand-sm bg-lightgreen navbar-dark mt-0 w-100">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menucollapse">
                <img src="img/menu2.png" alt="Menu" style="width: 30px; height: 30px;">
            </button>
            <div class="collapse navbar-collapse" id="menucollapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="Registro.html">login/Registro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Inventario.html">Ver Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="carrito de compra.html">Carrito</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <!--carrusel-->
        <div id="demo" class="carousel slide" data-bs-ride="carousel" style="margin-top: 15px;">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
                <button type="button" data-bs-target="#demo" data-bs-slide-to="3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="img/aniversarios1.png" alt="Aniversarios" class="d-block w-100">
                </div>
                <div class="carousel-item">
                    <img src="img/decoraciones1.png" alt="Decoraciones" class="d-block w-100">
                </div>
                <div class="carousel-item">
                    <img src="img/promociones1.png" alt="Promociones" class="d-block w-100">
                </div>
                <div class="carousel-item">
                    <img src="img/festividades1.png" alt="Festividades" class="d-block w-100">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>

        <div class="recomendados-box mt-4 mb-4 p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="m-0" style="color:#222;">Arreglos Recomendados</h2>
                <a href="Inventario.html" class="ver-mas-link px-3 py-1 rounded">Ver más</a>
            </div>
            <!-- Productos recomendados -->
            <div class="row row-cols-1 row-cols-md-4 row-cols-lg-4 g-4" id="productos-recomendados"></div>
        </div>
    </div>

    <!-- Banner Inferior -->
    <footer class="bg-lightgreen-footer text-white text-center py-3 mt-4">
        <p class="m-0">&copy; 2025 Floreria Julia Rosa | Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/productos.js"></script>
    <script>
        let cont = document.getElementById("productos-recomendados");
        productos.forEach(p => {
            cont.innerHTML += `
            <div class="col">
                <a href="producto.html?id=${p.id}" style="text-decoration: none; color: inherit;">
                <div class="card h-100">
                    <img src="${p.imagen}" class="card-img-top" alt="${p.nombre}">
                    <div class="card-body">
                        <h5 class="card-title">${p.nombre}</h5>
                        <p class="card-text">$${p.precio.toLocaleString()}</p>
                    </div>
                </div>
                </a>
            </div>`;
        });
    </script>
</body>
</html>
