<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito de Compra</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header class="bg-superlightgreen text-white py-3">
    <div class="container d-flex align-items-center justify-content-between">
        <div>
            <a href="Principal.html">
                <img src="img/logo png.png" alt="Logo Empresa" style="height: 100px;">
            </a>
        </div>
        <div class="flex-grow-1 text-center">
            <h1 class="display-2 fw-bold m-0">Floreria Julia Rosa</h1>
        </div>
        <div style="width:50px;"></div>
    </div>
</header>

<nav class="navbar navbar-expand-sm bg-lightgreen navbar-dark mt-0 w-100">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menucollapse">
            <img src="img/menu2.png" alt="Menu" style="width: 30px; height: 30px;">
        </button>
        <div class="collapse navbar-collapse" id="menucollapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="Registro.html">login/Registro</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="Inventario.html">Ver Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="carrito de compra.html">Carrito</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contacto.html">Contacto</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="titulo">Carrito de Compra</h2>
    <div class="table-responsive">
        <table class="table table-bordered align-middle">
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>
                    <th>Eliminar</th>
                </tr>
            </thead>
            <tbody id="carrito-body"></tbody>
        </table>
    </div>
    <div class="d-flex justify-content-end">
        <h4 id="total-carrito" class="me-4"></h4>
    </div>
    <div class="d-flex justify-content-end">
        <button class="btn btn-success me-2" id="btn-comprar">Finalizar Compra</button>
        <a href="Inventario.html" class="btn btn-secondary">Seguir Comprando</a>
    </div>
    <div id="mensaje-compra" class="mt-3"></div>
</div>

<footer class="bg-lightgreen-footer text-white text-center py-3 mt-4">
    <p class="m-0">&copy; 2025 Floreria Julia Rosa | Todos los derechos reservados</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/productos.js"></script>
<script>
function obtenerCarrito() {
    return JSON.parse(localStorage.getItem('carrito')) || [];
}

function guardarCarrito(carrito) {
    localStorage.setItem('carrito', JSON.stringify(carrito));
}

function renderCarrito() {
    const carrito = obtenerCarrito();
    const tbody = document.getElementById('carrito-body');
    tbody.innerHTML = '';
    let total = 0;
    if (carrito.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center">El carrito está vacío</td></tr>';
    } else {
        carrito.forEach((item, idx) => {
            const producto = window.productos.find(p => p.id === item.id);
            const subtotal = producto ? producto.precio * item.cantidad : 0;
            total += subtotal;
            tbody.innerHTML += `
                <tr>
                    <td><img src="${producto ? producto.imagen : ''}" width="60"></td>
                    <td>${producto ? producto.nombre : 'Producto eliminado'}</td>
                    <td>$${producto ? producto.precio.toLocaleString() : 0}</td>
                    <td>
                        <input type="number" min="1" value="${item.cantidad}" class="form-control form-control-sm" style="width:80px;" onchange="actualizarCantidad(${idx}, this.value)">
                    </td>
                    <td>$${subtotal.toLocaleString()}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="eliminarDelCarrito(${idx})">Eliminar</button>
                    </td>
                </tr>
            `;
        });
    }
    document.getElementById('total-carrito').innerText = 'Total: $' + total.toLocaleString();
}

function actualizarCantidad(idx, cantidad) {
    let carrito = obtenerCarrito();
    cantidad = parseInt(cantidad);
    if (cantidad < 1) cantidad = 1;
    carrito[idx].cantidad = cantidad;
    guardarCarrito(carrito);
    renderCarrito();
}

function eliminarDelCarrito(idx) {
    let carrito = obtenerCarrito();
    carrito.splice(idx, 1);
    guardarCarrito(carrito);
    renderCarrito();
}

document.getElementById('btn-comprar').onclick = function() {
    let carrito = obtenerCarrito();
    if (carrito.length === 0) {
        document.getElementById('mensaje-compra').innerHTML = '<div class="alert alert-warning">El carrito está vacío.</div>';
        return;
    }
    localStorage.removeItem('carrito');
    renderCarrito();
    document.getElementById('mensaje-compra').innerHTML = '<div class="alert alert-success">¡Gracias por su compra!</div>';
};

renderCarrito();
</script>
</body>
</html>
