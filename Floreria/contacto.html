<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <!-- Banner Superior -->
    <header class="bg-superlightgreen text-white py-3">
        <div class="container d-flex align-items-center justify-content-between">
            <!-- Logo con link -->
            <div>
                <a href="Principal.html">
                    <img src="img/logo png.png" alt="Logo Empresa" style="height: 100px;">
                </a>
            </div>
            <!-- Nombre Empresa -->
            <div class="flex-grow-1 text-center">
                <h1 class="display-2 fw-bold m-0">Floreria Julia Rosa</h1>
            </div>
            <!-- Espacio derecho vacío para equilibrio -->
            <div style="width:50px;"></div>
        </div>
    </header>

    <!-- menú de navegación (pegado al header y ancho completo) -->
    <nav class="navbar navbar-expand-sm bg-lightgreen navbar-dark mt-0 w-100">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menucollapse">
                <img src="img/menu2.png" alt="Menu" style="width: 30px; height: 30px;">
            </button>
            <div class="collapse navbar-collapse" id="menucollapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="Registro.html">login/Registro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Inventario.html">Ver Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="carrito de compra.html">Carrito</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="mb-4 text-center">Contacto Soporte</h2>
                <form id="form-contacto">
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="correo" placeholder="tu@email.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Mensaje</label>
                        <textarea class="form-control" id="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Enviar mensaje</button>
                    <div id="mensaje-exito" class="mt-3 text-success text-center"></div>
                </form>
            </div>
        </div>
    </div>

    <hr>
    <div class="text-center mt-4">
        <button id="btn-wsp" class="btn btn-success">
            Contáctanos por WhatsApp
        </button>
        <div id="info-wsp" class="alert alert-info mt-3 d-none" role="alert">
            <strong>WhatsApp:</strong> +56912345678<br>
            <strong>Instagram:</strong> <a href="https://www.instagram.com/floreria.juliarosa/" target="_blank">@floreria.juliarosa</a>
        </div>
    </div>

    <!-- Banner Inferior -->
    <footer class="bg-lightgreen-footer text-white text-center py-3 mt-4">
        <p class="m-0">&copy; 2025 Floreria Julia Rosa | Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/metodo.js"></script>
    <script>
        document.getElementById('form-contacto').addEventListener('submit', enviarMensajeSoporte);
        document.getElementById('btn-wsp').addEventListener('click', mostrarInfoWsp);
    </script>
</body>
</html>
